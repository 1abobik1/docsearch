name: docsearch

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://docsearch:docsearch@postgres:5432/docsearch
  ELASTICSEARCH_URL: http://elasticsearch:9200
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch
      POSTGRES_DB: docsearch
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job: applies migrations, imports the CSV and builds the index.
  # Idempotent, so it is safe to run on every `docker compose up`.
  init:
    build: .
    environment: *app-env
    command: sh -c "alembic upgrade head && python -m app.cli seed data/posts.csv"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      DATABASE_URL: postgresql+asyncpg://docsearch:docsearch@postgres:5432/docsearch_test
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: test-documents
      ENVIRONMENT: test
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./docs.json:/app/docs.json:ro
    command: pytest -p no:cacheprovider
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pg-data:
  es-data:
