[project]
name = "docsearch"
version = "1.0.0"
description = "Simple full-text search service over documents (FastAPI + PostgreSQL + Elasticsearch)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<1",
    "alembic>=1.20,<2",
    "elasticsearch[async]>=9.5,<10",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[project.scripts]
docsearch = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PT", "ASYNC", "S", "BLE", "TRY", "PL", "RUF", "ERA",
]
ignore = [
    "PLR0913",  # FastAPI endpoints legitimately take many params
    "TRY003",   # messages in exception constructors are fine here
    "RUF001", "RUF003",  # Cyrillic text is expected in this project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "functional: requires running PostgreSQL and Elasticsearch",
]
addopts = "-ra --strict-markers"
